name: Build SliqServer Windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/SliqServer-v4.py.gz.b64'
      - 'tools/patch_sliqserver_address.py'
      - 'tools/apply_address_patch.py'
      - 'tools/apply_windows_server_branding_v4.py'
      - '.github/workflows/build-sliqserver-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sliqserver-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct Windows v4 source
        shell: pwsh
        run: |
          $b64 = (Get-Content windows/SliqServer-v4.py.gz.b64 -Raw) -replace '\s',''
          $compressed = [Convert]::FromBase64String($b64)
          $input = New-Object IO.MemoryStream(,$compressed)
          $gzip = New-Object IO.Compression.GZipStream($input,[IO.Compression.CompressionMode]::Decompress)
          $output = New-Object IO.MemoryStream
          $gzip.CopyTo($output)
          $gzip.Dispose(); $input.Dispose()
          [IO.File]::WriteAllBytes('windows/sliqserver_v4.py',$output.ToArray())
          $output.Dispose()

      - name: Validate patch tools
        run: python -m py_compile tools/apply_address_patch.py tools/patch_sliqserver_address.py tools/apply_windows_server_branding_v4.py

      - name: Apply easier custom-address setup
        run: python tools/apply_address_patch.py windows windows/sliqserver_v4.py

      - name: Apply server logo and description
        run: python tools/apply_windows_server_branding_v4.py windows/sliqserver_v4.py

      - name: Validate Windows v4 source
        run: python -m py_compile windows/sliqserver_v4.py

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller psutil pillow

      - name: Build Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SliqServer-Windows windows/sliqserver_v4.py

      - name: Stage EXE outside repository
        shell: pwsh
        run: Copy-Item dist/SliqServer-Windows.exe "$env:RUNNER_TEMP/SliqServer-Windows.exe" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SliqServer-Windows
          path: dist/SliqServer-Windows.exe

      - name: Publish EXE to GitHub Pages downloads
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin main
            git reset --hard origin/main
            New-Item -ItemType Directory -Force downloads | Out-Null
            Copy-Item "$env:RUNNER_TEMP/SliqServer-Windows.exe" downloads/SliqServer-Windows.exe -Force
            git add downloads/SliqServer-Windows.exe
            $changes = git diff --cached --name-only
            if (-not $changes) {
              Write-Host "EXE unchanged"
              exit 0
            }
            git commit -m "Build SliqServer Windows v4"
            git push origin main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Publish race detected; retrying ($attempt/3)..."
            Start-Sleep -Seconds 3
          }
          throw "Could not publish EXE after 3 attempts"
