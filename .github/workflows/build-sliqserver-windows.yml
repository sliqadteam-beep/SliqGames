name: Build SliqServer Windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/sliqserver_v3.py'
      - '.github/workflows/build-sliqserver-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sliqserver-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Windows v3 source
        run: python -m py_compile windows/sliqserver_v3.py

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller psutil

      - name: Build Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SliqServer-Windows windows/sliqserver_v3.py

      - name: Stage EXE outside repository
        shell: pwsh
        run: Copy-Item dist/SliqServer-Windows.exe "$env:RUNNER_TEMP/SliqServer-Windows.exe" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SliqServer-Windows
          path: dist/SliqServer-Windows.exe

      - name: Publish EXE to GitHub Pages downloads
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          New-Item -ItemType Directory -Force downloads | Out-Null
          Copy-Item "$env:RUNNER_TEMP/SliqServer-Windows.exe" downloads/SliqServer-Windows.exe -Force
          git add downloads/SliqServer-Windows.exe
          $changes = git diff --cached --name-only
          if (-not $changes) {
            Write-Host "EXE unchanged"
          } else {
            git commit -m "Build SliqServer Windows v3"
            git push origin main
          }
