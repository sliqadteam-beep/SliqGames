name: Build SliqServer Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/SliqServer/**'
      - '.github/workflows/build-sliqserver.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sliqserver-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android v2 sources
        run: |
          set -euo pipefail
          SRC="android/SliqServer/app/src/main/java/org/sliqado/sliqserver"
          decode_source() {
            tr -d '[:space:]' < "$1" | base64 -d | gzip -d > "$2"
          }
          decode_source android/SliqServer/source/MainActivityV2.kt.gz.b64 "$SRC/MainActivityV2.kt"
          decode_source android/SliqServer/source/TermuxBridge.kt.gz.b64 "$SRC/TermuxBridge.kt"
          decode_source android/SliqServer/source/TermuxResultService.kt.gz.b64 "$SRC/TermuxResultService.kt"
          rm -f "$SRC/MainActivity.kt"
          test -s "$SRC/MainActivityV2.kt"
          test -s "$SRC/TermuxBridge.kt"
          test -s "$SRC/TermuxResultService.kt"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Keep a stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sliqserver-debug-keystore-v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android/SliqServer
        run: gradle --no-daemon clean assembleDebug

      - name: Stage APK outside repository
        run: cp android/SliqServer/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/SliqServer-Android.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SliqServer-Android-APK
          path: android/SliqServer/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Pages downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p downloads
          cp "$RUNNER_TEMP/SliqServer-Android.apk" downloads/SliqServer-Android.apk
          git add downloads/SliqServer-Android.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Build SliqServer Android v2"
            git push origin main
          fi
