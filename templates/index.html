<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SliqGames</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Segoe UI,sans-serif;
    background:#07111f;
    color:white;
}

header{
    height:72px;
    background:#0b1829;
    border-bottom:1px solid #1c3048;
    display:flex;
    align-items:center;
    padding:0 25px;
    gap:14px;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    width:44px;
    height:44px;
    border-radius:12px;
    background:linear-gradient(135deg,#2563eb,#60a5fa);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:20px;
}

.brand{
    background:none;
    border:0;
    color:white;
    font-size:21px;
    font-weight:900;
    cursor:pointer;
}

.spacer{
    flex:1;
}

select,input,textarea{
    background:#101f34;
    border:1px solid #243952;
    color:white;
    border-radius:10px;
    padding:11px;
}

button{
    cursor:pointer;
}

.login,.uploadBtn{
    background:#2563eb;
    border:0;
    color:white;
    font-weight:700;
    padding:11px 16px;
    border-radius:10px;
}

.uploadBtn{
    font-size:22px;
    width:44px;
    height:44px;
    padding:0;
}

main{
    max-width:1250px;
    margin:auto;
    padding:30px 20px 60px;
}

.hero{
    padding:35px;
    border-radius:25px;
    background:linear-gradient(135deg,#102b52,#0b1829);
    border:1px solid #203a59;
    margin-bottom:30px;
}

.hero h1{
    font-size:42px;
    margin:0 0 10px;
}

.hero p{
    color:#9fb0c7;
}

.search{
    width:100%;
    margin-top:15px;
    font-size:15px;
}

.section{
    margin-top:35px;
}

.section h2{
    font-size:22px;
    margin-bottom:15px;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:17px;
}

.game{
    background:#0d1b2d;
    border:1px solid #1d3047;
    border-radius:18px;
    padding:15px;
    transition:.2s;
    cursor:pointer;
}

.game:hover{
    transform:translateY(-4px);
    border-color:#3b82f6;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.gameicon{
    height:145px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    background:#172c48;
    margin-bottom:13px;
    overflow:hidden;
}

.gameicon img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.game h3{
    margin:0 0 6px;
}

.game p{
    margin:0;
    font-size:13px;
    color:#8ea0b8;
}

.genre{
    display:inline-block;
    margin-top:10px;
    font-size:11px;
    background:#172c48;
    padding:5px 8px;
    border-radius:7px;
    color:#93c5fd;
}

.empty{
    color:#718096;
    padding:10px 0;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
}

.modal.open{
    display:flex;
}

.box{
    width:min(500px,92%);
    max-height:90vh;
    overflow:auto;
    background:#0d192b;
    border:1px solid #243952;
    border-radius:20px;
    padding:25px;
}

.box h2{
    margin-top:0;
}

.box input,
.box textarea,
.box select{
    width:100%;
    margin:7px 0;
}

.box textarea{
    min-height:100px;
    resize:vertical;
}

.box button{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-weight:bold;
}

.close{
    background:#18283d!important;
}

.fileLabel{
    display:block;
    margin-top:12px;
    margin-bottom:4px;
    color:#9fb0c7;
    font-size:14px;
}

.fileInput{
    padding:10px!important;
}

footer{
    text-align:center;
    padding:30px;
    color:#53657c;
}

@media(max-width:700px){

    header{
        padding:0 10px;
        gap:7px;
    }

    .brand{
        font-size:18px;
    }

    header select{
        max-width:115px;
    }

    .login{
        font-size:0;
        padding:11px;
    }

    .login::after{
        content:"👤";
        font-size:18px;
    }

    .hero{
        padding:25px;
    }

    .hero h1{
        font-size:30px;
    }

    .games{
        grid-template-columns:repeat(2,1fr);
    }

    .gameicon{
        height:110px;
        font-size:42px;
    }
}
</style>
</head>

>

</section>


<!-- ZULETZT GESPIELT - NUR EINMAL -->

<section class="section">

<h2 id="recentTitle">
Zuletzt gespielt
</h2>

<div class="games" id="recentGames"></div>

</section>


<!-- ARCHER HERO -->

<section class="section">

<h2 id="actionTitle">
⚔️ Action
</h2>

<div class="games">

<div
class="game"
onclick="playGame('Archer Hero')"

>

<div class="gameicon">
🏹
</div>

<h3>
Archer Hero
</h3>

<p id="archerDesc">
Besiege deine Gegner!
</p>

<span class="genre">
Action
</span>

</div>

</div>

</section>


<!-- COMMUNITY SPIELE -->

<section class="section">

<h2 id="communityTitle">
🎮 Community-Spiele
</h2>

<div class="games" id="communityGames"></div>

</section>

</main>


<footer>
SliqGames © 2026
</footer>


<!-- LOGIN -->

<div class="modal" id="loginModal">

<div class="box">

<h2 id="loginTitle">
Anmelden
</h2>

<input
id="username"
placeholder="Benutzername"
>

<input
id="password"
type="password"
placeholder="Passwort"
>

<button
onclick="login()"
id="loginAction"
>
Anmelden
</button>

<button
onclick="register()"
id="registerAction"
>
Registrieren
</button>

<button
class="close"
onclick="closeLogin()"
id="closeLoginButton"
>
Schließen
</button>

</div>

</div>


<!-- SPIEL HOCHLADEN -->

<div class="modal" id="uploadModal">

<div class="box">

<h2 id="uploadTitle">
🎮 Spiel hinzufügen
</h2>

<form
action="/upload"
method="POST"
enctype="multipart/form-data"
>

<input
name="name"
id="gameNameInput"
placeholder="Spielname"
required
>

<select
name="genre"
id="genre"
required
>

<option value="" id="genrePlaceholder">
Genre auswählen
</option>

<option value="Action">Action</option>
<option value="Adventure">Adventure</option>
<option value="Arcade">Arcade</option>
<option value="Casual">Casual</option>
<option value="Horror">Horror</option>
<option value="Racing">Racing</option>
<option value="Sports">Sports</option>
<option value="Strategy">Strategy</option>
<option value="Funny">Funny</option>
<option value="Other">Other</option>

</select>

<textarea
name="description"
id="description"
placeholder="Spielbeschreibung"
required
></textarea>

<label
class="fileLabel"
id="gameFileLabel"
>
Spiel-Datei
</label>

<input
class="fileInput"
type="file"
name="game"
accept=".html,.htm,.zip"
required
>

<label
class="fileLabel"
id="thumbnailLabel"
>
Thumbnail
</label>

<input
class="fileInput"
type="file"
name="thumbnail"
accept="image/png,image/jpeg,image/webp"
required
>

<button
type="submit"
id="uploadButton"
>
Spiel veröffentlichen
</button>

</form>

<button
class="close"
onclick="closeUpload()"
id="closeUploadButton"
>
Schließen
</button>

</div>

</div>

function getLanguage(){

return document.getElementById("language").value;

}


function changeLanguage(){

const lang=getLanguage();
const t=translations[lang];

localStorage.setItem("language",lang);

document.documentElement.lang=lang;

document.getElementById("welcome").textContent=t.welcome;
document.getElementById("subtitle").textContent=t.subtitle;
document.getElementById("search").placeholder=t.search;

document.getElementById("recentTitle").textContent=t.recent;

document.getElementById("loginButton").textContent=t.login;
document.getElementById("loginTitle").textContent=t.loginTitle;
document.getElementById("loginAction").textContent=t.loginAction;
document.getElementById("registerAction").textContent=t.register;

document.getElementById("closeLoginButton").textContent=t.close;

document.getElementById("uploadTitle").textContent=t.upload;
document.getElementById("uploadButton").textContent=t.publish;
document.getElementById("closeUploadButton").textContent=t.close;

document.getElementById("communityTitle").textContent=t.community;
document.getElementById("actionTitle").textContent=t.action;

document.getElementById("archerDesc").textContent=t.archer;

document.getElementById("gameNameInput").placeholder=t.gameName;
document.getElementById("description").placeholder=t.description;

document.getElementById("genrePlaceholder").textContent=t.genre;

document.getElementById("gameFileLabel").textContent=t.gameFile;
document.getElementById("thumbnailLabel").textContent=t.thumbnail;

loadRecent();

loadCommunityGames();

}


function goHome(){

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function openLogin(){

document
.getElementById("loginModal")
.classList.add("open");

}


function closeLogin(){

document
.getElementById("loginModal")
.classList.remove("open");

}


function openUpload(){

document
.getElementById("uploadModal")
.classList.add("open");

}


function closeUpload(){

document
.getElementById("uploadModal")
.classList.remove("open");

}


function register(){

const username=
document.getElementById("username")
.value
.trim();

const password=
document.getElementById("password")
.value;

if(!username || !password){

alert("Bitte Benutzername und Passwort eingeben.");

return;

}

localStorage.setItem(
"sliq_user",
JSON.stringify({
username:username,
password:password
})
);

alert("Account wurde gespeichert!");

closeLogin();

}


function login(){

const username=
document.getElementById("username")
.value
.trim();

const password=
document.getElementById("password")
.value;

const saved=
JSON.parse(
localStorage.getItem("sliq_user") || "null"
);

if(
saved &&
saved.username===username &&
saved.password===password
){

alert("Erfolgreich angemeldet!");

closeLogin();

}else{

alert("Benutzername oder Passwort falsch.");

}

}


function playGame(name){

let recent=
JSON.parse(
localStorage.getItem("recentGames") || "[]"
);

recent=
recent.filter(
x=>x!==name
);

recent.unshift(name);

recent=
recent.slice(0,6);

localStorage.setItem(
"recentGames",
JSON.stringify(recent)
);

loadRecent();

if(name==="Archer Hero"){

alert(
"Archer Hero wird bald verfügbar sein! 🏹"
);

}

}


function loadRecent(){

const recent=
JSON.parse(
localStorage.getItem("recentGames") || "[]"
);

const container=
document.getElementById("recentGames");

container.innerHTML="";

const lang=getLanguage();

const t=translations[lang];

if(!recent.length){

container.innerHTML=
`<p class="empty">${t.noRecent}</p>`;

return;

}

recent.forEach(name=>{

const div=
document.createElement("div");

div.className="game";

div.onclick=()=>{
playGame(name);
};

let icon="🎮";

if(name==="Archer Hero"){
icon="🏹";
}

div.innerHTML=`

<div class="gameicon">
${icon}
</div>

<h3>${escapeHtml(name)}</h3>

<p>${t.play}</p>

`;

container.appendChild(div);

});

}


function loadCommunityGames(){

fetch("/games.json")

.then(response=>{

if(!response.ok){
throw new Error("games.json not found");
}

return response.json();

})

.then(games=>{

const container=
document.getElementById("communityGames");

container.innerHTML="";

if(!games.length){

container.innerHTML=
`<p class="empty">Noch keine Community-Spiele.</p>`;

return;

}

games.forEach(game=>{

const div=
document.createElement("div");

div.className="game";

div.onclick=()=>{

window.location.href=
"/uploads/games/"
+
encodeURIComponent(game.game);

};

div.innerHTML=`

<div class="gameicon">

<img
src="/uploads/thumbnails/${encodeURIComponent(game.thumbnail)}"
alt=""
>

</div>

<h3>
${escapeHtml(game.name)}
</h3>

<p>
${escapeHtml(game.description)}
</p>

<span class="genre">
${escapeHtml(game.genre)}
</span>

`;

container.appendChild(div);

});

})

.catch(error=>{

console.log(
"Community-Spiele konnten nicht geladen werden:",
error
);

});

}


function searchGames(){

const value=
document
.getElementById("search")
.value
.toLowerCase()
.trim();

document
.querySelectorAll(".game")
.forEach(game=>{

const text=
game.innerText.toLowerCase();

game.style.display=
text.includes(value)
? ""
: "none";

});

}


function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


const savedLanguage=
localStorage.getItem("language");

if(savedLanguage &&
translations[savedLanguage]){

document.getElementById("language").value=
savedLanguage;

}

changeLanguage();

loadRecent();

loadCommunityGames();

</script>

</body>
</html>
