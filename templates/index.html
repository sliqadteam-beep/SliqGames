<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SliqGames</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Segoe UI,sans-serif;
background:#07111f;
color:white;
}

header{
height:72px;
background:#0b1829;
border-bottom:1px solid #1c3048;
display:flex;
align-items:center;
padding:0 25px;
gap:14px;
position:sticky;
top:0;
z-index:10;
}

.logo{
width:44px;
height:44px;
border-radius:12px;
background:linear-gradient(135deg,#2563eb,#60a5fa);
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
font-size:20px;
}

.brand{
background:none;
border:0;
color:white;
font-size:21px;
font-weight:900;
cursor:pointer;
}

.spacer{flex:1}

select,input,textarea{
background:#101f34;
border:1px solid #243952;
color:white;
border-radius:10px;
padding:11px;
}

button{
cursor:pointer;
}

.login,.uploadBtn{
background:#2563eb;
border:0;
color:white;
font-weight:700;
padding:11px 16px;
border-radius:10px;
}

main{
max-width:1250px;
margin:auto;
padding:30px 20px 60px;
}

.hero{
padding:35px;
border-radius:25px;
background:linear-gradient(135deg,#102b52,#0b1829);
border:1px solid #203a59;
margin-bottom:30px;
}

.hero h1{
font-size:42px;
margin:0 0 10px;
}

.hero p{
color:#9fb0c7;
}

.search{
width:100%;
margin-top:15px;
font-size:15px;
}

.section{
margin-top:35px;
}

.section h2{
font-size:22px;
}

.games{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
gap:17px;
}

.game{
background:#0d1b2d;
border:1px solid #1d3047;
border-radius:18px;
padding:15px;
transition:.2s;
cursor:pointer;
}

.game:hover{
transform:translateY(-4px);
border-color:#3b82f6;
}

.gameicon{
height:145px;
border-radius:13px;
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
background:#172c48;
margin-bottom:13px;
overflow:hidden;
}

.gameicon img{
width:100%;
height:100%;
object-fit:cover;
}

.game h3{
margin:0 0 6px;
}

.game p{
margin:0;
font-size:13px;
color:#8ea0b8;
}

.genre{
display:inline-block;
margin-top:10px;
font-size:11px;
background:#172c48;
padding:5px 8px;
border-radius:7px;
color:#93c5fd;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
display:none;
align-items:center;
justify-content:center;
z-index:100;
}

.modal.open{
display:flex;
}

.box{
width:min(500px,92%);
max-height:90vh;
overflow:auto;
background:#0d192b;
border:1px solid #243952;
border-radius:20px;
padding:25px;
}

.box h2{
margin-top:0;
}

.box input,
.box textarea,
.box select{
width:100%;
margin:7px 0;
}

.box button{
width:100%;
padding:13px;
margin-top:8px;
border:0;
border-radius:10px;
background:#2563eb;
color:white;
font-weight:bold;
}

.close{
background:#18283d!important;
}

#gameModal{
z-index:200;
}

.archerGame{
width:min(950px,96vw);
background:#091522;
border:1px solid #29435e;
border-radius:20px;
padding:15px;
}

.archerHeader{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:10px;
gap:10px;
}

.archerStats{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.stat{
background:#12243a;
padding:8px 12px;
border-radius:9px;
font-weight:bold;
}

#archerCanvas{
width:100%;
height:auto;
display:block;
background:#172c48;
border-radius:14px;
border:1px solid #29435e;
cursor:crosshair;
touch-action:none;
}

.gameButtons{
display:flex;
gap:10px;
margin-top:10px;
}

.gameButtons button{
flex:1;
padding:12px;
border:0;
border-radius:10px;
color:white;
font-weight:bold;
background:#2563eb;
}

.gameButtons .secondary{
background:#18283d;
}

footer{
text-align:center;
padding:30px;
color:#53657c;
}

@media(max-width:700px){

header{
padding:0 10px;
}

.brand{
font-size:18px;
}

header select{
max-width:100px;
}

.login{
padding:10px;
font-size:12px;
}

.uploadBtn{
padding:10px 14px;
}

.hero{
padding:25px;
}

.hero h1{
font-size:30px;
}

.archerGame{
padding:10px;
}

}
</style>
</head>

</div>

function getLang(){

return document.getElementById("language").value || "de";

}


function changeLanguage(){

const lang=getLang();
const t=translations[lang];

localStorage.setItem("language",lang);

document.documentElement.lang=lang;

document.getElementById("welcome").textContent=t.welcome;
document.getElementById("subtitle").textContent=t.subtitle;
document.getElementById("search").placeholder=t.search;
document.getElementById("recentTitle").textContent=t.recent;
document.getElementById("loginButton").textContent=t.login;
document.getElementById("loginTitle").textContent=t.loginTitle;
document.getElementById("loginAction").textContent=t.loginAction;
document.getElementById("registerAction").textContent=t.register;
document.getElementById("closeLoginButton").textContent=t.close;
document.getElementById("uploadTitle").textContent=t.upload;
document.getElementById("uploadButton").textContent=t.publish;
document.getElementById("communityTitle").textContent=t.community;
document.getElementById("archerDesc").textContent=t.archer;
document.getElementById("gameNameInput").placeholder=t.gameName;
document.getElementById("description").placeholder=t.description;

loadRecent();

}


function goHome(){

closeArcher();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function openLogin(){

document.getElementById("loginModal").classList.add("open");

}


function closeLogin(){

document.getElementById("loginModal").classList.remove("open");

}


function openUpload(){

document.getElementById("uploadModal").classList.add("open");

}


function closeUpload(){

document.getElementById("uploadModal").classList.remove("open");

}


function register(){

const username=document.getElementById("username").value.trim();
const password=document.getElementById("password").value;

const lang=getLang();
const t=translations[lang];

if(!username || !password){

alert(t.empty);
return;

}

localStorage.setItem(
"sliq_user",
JSON.stringify({
username:username,
password:password
})
);

alert(t.registered);

closeLogin();

}


function login(){

const username=document.getElementById("username").value.trim();
const password=document.getElementById("password").value;

const lang=getLang();
const t=translations[lang];

if(!username || !password){

alert(t.empty);
return;

}

const saved=JSON.parse(
localStorage.getItem("sliq_user") || "null"
);

if(
saved &&
saved.username===username &&
saved.password===password
){

localStorage.setItem(
"sliq_logged_in",
"true"
);

alert(t.success);

closeLogin();

}else{

alert(t.wrong);

}

}


function saveRecent(name){

let recent=JSON.parse(
localStorage.getItem("recentGames") || "[]"
);

recent=recent.filter(x=>x!==name);

recent.unshift(name);

recent=recent.slice(0,6);

localStorage.setItem(
"recentGames",
JSON.stringify(recent)
);

}


function playGame(name){

saveRecent(name);

if(name==="Archer Hero"){

startArcherHero();

}

loadRecent();

}


function loadRecent(){

const recent=JSON.parse(
localStorage.getItem("recentGames") || "[]"
);

const container=document.getElementById("recentGames");

container.innerHTML="";

const t=translations[getLang()];

if(!recent.length){

container.innerHTML=
"<p style='color:#718096'>"+
t.noRecent+
"</p>";

return;

}

recent.forEach(name=>{

const div=document.createElement("div");

div.className="game";

div.onclick=()=>playGame(name);

let icon="🎮";

if(name==="Archer Hero"){
icon="🏹";
}

div.innerHTML=`

<div class="gameicon">
${icon}
</div>

<h3>${escapeHtml(name)}</h3>

<p>▶ Play</p>

`;

container.appendChild(div);

});

}


function escapeHtml(text){

const div=document.createElement("div");

div.textContent=text;

return div.innerHTML;

}


function loadCommunityGames(){

fetch("/games.json?"+Date.now())

.then(r=>{

if(!r.ok) throw new Error();

return r.json();

})

.then(games=>{

const container=document.getElementById("communityGames");

container.innerHTML="";

games.forEach(game=>{

const div=document.createElement("div");

div.className="game";

div.onclick=()=>{

saveRecent(game.name);

window.location.href=
"/uploads/games/"+
encodeURIComponent(game.game);

};

div.innerHTML=`

<div class="gameicon">

<img
src="/uploads/thumbnails/${encodeURIComponent(game.thumbnail)}"
alt=""
>

</div>

<h3>${escapeHtml(game.name)}</h3>

<p>${escapeHtml(game.description)}</p>

<span class="genre">
${escapeHtml(game.genre)}
</span>

`;

container.appendChild(div);

});

})

.catch(()=>{});

}


function searchGames(){

const value=
document
.getElementById("search")
.value
.toLowerCase()
.trim();

document
.querySelectorAll(".game")
.forEach(game=>{

const text=
game.innerText.toLowerCase();

game.style.display=
text.includes(value)
? ""
: "none";

});

}


/* =========================
   ARCHER HERO
========================= */

const canvas=
document.getElementById("archerCanvas");

const ctx=
canvas.getContext("2d");

let archer={
running:false,
score:0,
hp:3,
wave:1,
player:{
x:100,
y:250,
size:32
},
arrow:null,
enemies:[],
lastSpawn:0,
spawnDelay:1300,
keys:{}
};


function startArcherHero(){

saveRecent("Archer Hero");

document
.getElementById("gameModal")
.classList
.add("open");

restartArcher();

}


function closeArcher(){

archer.running=false;

document
.getElementById("gameModal")
.classList
.remove("open");

}


function restartArcher(){

archer.running=true;

archer.score=0;
archer.hp=3;
archer.wave=1;
archer.arrow=null;
archer.enemies=[];
archer.lastSpawn=performance.now();
archer.spawnDelay=1300;

updateArcherStats();

requestAnimationFrame(archerLoop);

}


function updateArcherStats(){

document.getElementById("hpText").textContent=
archer.hp;

document.getElementById("scoreText").textContent=
archer.score;

document.getElementById("waveText").textContent=
archer.wave;

}


function spawnEnemy(){

const y=
40+
Math.random()*
(canvas.height-80);

const size=
28+
Math.random()*18;

archer.enemies.push({

x:canvas.width+size,
y:y,
size:size,
speed:1.5+
archer.wave*.18+
Math.random()*1.2

});

}


function shootArrow(targetX,targetY){

if(!archer.running){
return;
}

if(archer.arrow){
return;
}

const dx=
targetX-archer.player.x;

const dy=
targetY-archer.player.y;

const distance=
Math.sqrt(dx*dx+dy*dy);

archer.arrow={

x:archer.player.x+25,
y:archer.player.y,
vx:(dx/distance)*10,
vy:(dy/distance)*10

};

}


canvas.addEventListener(
"pointerdown",
function(event){

const rect=
canvas.getBoundingClientRect();

const scaleX=
canvas.width/rect.width;

const scaleY=
canvas.height/rect.height;

const x=
(event.clientX-rect.left)*scaleX;

const y=
(event.clientY-rect.top)*scaleY;

shootArrow(x,y);

}
);


document.addEventListener(
"keydown",
function(event){

archer.keys[event.key.toLowerCase()]=true;

}
);


document.addEventListener(
"keyup",
function(event){

archer.keys[event.key.toLowerCase()]=false;

}
);


function updateArcher(){

if(!archer.running){
return;
}

const p=archer.player;

if(
archer.keys["w"] ||
archer.keys["arrowup"]
){

p.y-=5;

}

if(
archer.keys["s"] ||
archer.keys["arrowdown"]
){

p.y+=5;

}

if(
archer.keys["a"] ||
archer.keys["arrowleft"]
){

p.x-=5;

}

if(
archer.keys["d"] ||
archer.keys["arrowright"]
){

p.x+=5;

}

p.x=
Math.max(
30,
Math.min(canvas.width-30,p.x)
);

p.y=
Math.max(
30,
Math.min(canvas.height-30,p.y)
);


if(
performance.now()-archer.lastSpawn>
archer.spawnDelay
){

spawnEnemy();

archer.lastSpawn=
performance.now();

if(archer.spawnDelay>500){

archer.spawnDelay-=15;

}

}


if(archer.arrow){

archer.arrow.x+=
archer.arrow.vx;

archer.arrow.y+=
archer.arrow.vy;

if(
archer.arrow.x<0 ||
archer.arrow.x>canvas.width ||
archer.arrow.y<0 ||
archer.arrow.y>canvas.height
){

archer.arrow=null;

}

}


for(
let i=archer.enemies.length-1;
i>=0;
i--
){

const enemy=
archer.enemies[i];

enemy.x-=enemy.speed;


const dx=
enemy.x-p.x;

const dy=
enemy.y-p.y;

const dist=
Math.sqrt(dx*dx+dy*dy);

if(
dist<
enemy.size/2+p.size/2
){

archer.enemies.splice(i,1);

archer.hp--;

updateArcherStats();

if(archer.hp<=0){

gameOverArcher();

return;

}

continue;

}


if(archer.arrow){

const ax=
enemy.x-archer.arrow.x;

const ay=
enemy.y-archer.arrow.y;

const ad=
Math.sqrt(ax*ax+ay*ay);

if(ad<enemy.size){

archer.enemies.splice(i,1);

archer.arrow=null;

archer.score++;

archer.wave=
1+
Math.floor(archer.score/10);

updateArcherStats();

continue;

}

}


if(enemy.x<-50){

archer.enemies.splice(i,1);

archer.hp--;

updateArcherStats();

if(archer.hp<=0){

gameOverArcher();

return;

}

}

}

}


function drawArcher(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


/* background */

const gradient=
ctx.createLinearGradient(
0,
0,
0,
canvas.height
);

gradient.addColorStop(
0,
"#102b45"
);

gradient.addColorStop(
1,
"#07111f"
);

ctx.fillStyle=gradient;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/* ground */

ctx.fillStyle="#12304a";

ctx.fillRect(
0,
canvas.height-55,
canvas.width,
55
);


/* stars */

ctx.fillStyle="rgba(255,255,255,.35)";

for(let i=0;i<35;i++){

const x=(i*97)%canvas.width;
const y=(i*53)%(canvas.height-70);

ctx.fillRect(x,y,2,2);

}


/* player */

const p=archer.player;

ctx.save();

ctx.translate(
p.x,
p.y
);

ctx.fillStyle="#2563eb";

ctx.beginPath();

ctx.arc(
0,
0,
p.size/2,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="#60a5fa";

ctx.beginPath();

ctx.arc(
0,
-22,
13,
0,
Math.PI*2
);

ctx.fill();

ctx.strokeStyle="#d99a62";

ctx.lineWidth=5;

ctx.beginPath();

ctx.arc(
12,
0,
22,
-Math.PI/2,
Math.PI/2
);

ctx.stroke();

ctx.restore();


/* arrow */

if(archer.arrow){

ctx.save();

ctx.translate(
archer.arrow.x,
archer.arrow.y
);

const angle=
Math.atan2(
archer.arrow.vy,
archer.arrow.vx
);

ctx.rotate(angle);

ctx.strokeStyle="#f1f5f9";

ctx.lineWidth=3;

ctx.beginPath();

ctx.moveTo(-18,0);
ctx.lineTo(15,0);

ctx.stroke();

ctx.fillStyle="#e2e8f0";

ctx.beginPath();

ctx.moveTo(15,0);
ctx.lineTo(7,-5);
ctx.lineTo(7,5);
ctx.closePath();

ctx.fill();

ctx.restore();

}


/* enemies */

archer.enemies.forEach(enemy=>{

ctx.save();

ctx.translate(
enemy.x,
enemy.y
);

ctx.fillStyle="#ef4444";

ctx.beginPath();

ctx.arc(
0,
0,
enemy.size/2,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="#7f1d1d";

ctx.beginPath();

ctx.arc(
0,
0,
enemy.size/2-7,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="white";

ctx.beginPath();

ctx.arc(-6,-3,4,0,Math.PI*2);

ctx.arc(6,-3,4,0,Math.PI*2);

ctx.fill();

ctx.fillStyle="#111827";

ctx.beginPath();

ctx.arc(-6,-3,2,0,Math.PI*2);

ctx.arc(6,-3,2,0,Math.PI*2);

ctx.fill();

ctx.restore();

});

}


function archerLoop(){

if(!archer.running){
return;
}

updateArcher();

drawArcher();

requestAnimationFrame(archerLoop);

}


function gameOverArcher(){

archer.running=false;

setTimeout(function(){

alert(
"🏹 Game Over!\n\n"+
"Score: "+
archer.score+
"\n\nKlicke auf Neustart."
);

},50);

}


const savedLanguage=
localStorage.getItem("language");

if(savedLanguage &&
translations[savedLanguage]){

document.getElementById("language").value=
savedLanguage;

}

changeLanguage();

loadRecent();

loadCommunityGames();

</script>

</body>
</html>
