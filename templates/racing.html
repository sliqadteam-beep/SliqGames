<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Racing - SliqGames</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b14;color:white;font-family:Arial,sans-serif;overflow:hidden}
.top{height:65px;background:#0b1829;border-bottom:1px solid #20344d;display:flex;align-items:center;padding:0 20px}
.top button{background:#2563eb;color:white;border:0;border-radius:10px;padding:10px 16px;font-weight:bold;cursor:pointer}
.title{flex:1;text-align:center;font-size:22px;font-weight:900}
#game{position:relative;width:100vw;height:calc(100vh - 65px);overflow:hidden;background:#111}
.road{position:absolute;left:50%;transform:translateX(-50%);width:min(500px,90vw);height:100%;background:#252525;border-left:8px solid #eee;border-right:8px solid #eee;overflow:hidden}
.line{position:absolute;width:10px;height:80px;background:white;left:50%;transform:translateX(-50%)}
.car{position:absolute;width:55px;height:95px;background:#2563eb;border-radius:12px;bottom:45px;left:50%;transform:translateX(-50%);box-shadow:0 0 20px #2563eb;z-index:5}
.car:before{content:"";position:absolute;width:35px;height:35px;background:#8ec5ff;border-radius:8px;left:10px;top:10px}
.enemy{position:absolute;width:55px;height:95px;background:#ef4444;border-radius:12px;box-shadow:0 0 15px #ef4444;z-index:4}
.enemy:before{content:"";position:absolute;width:35px;height:35px;background:#ffaaaa;border-radius:8px;left:10px;top:10px}
.hud{position:absolute;top:15px;left:15px;z-index:20;background:rgba(5,11,20,.85);border:1px solid #304966;border-radius:12px;padding:12px 16px;font-weight:bold}
.gameover{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);z-index:50}
.gameoverBox{background:#0d192b;border:1px solid #304966;border-radius:20px;padding:30px;text-align:center;width:min(400px,90%)}
.gameoverBox button{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:bold;cursor:pointer;margin-top:10px}
.controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:15px;z-index:30}
.controls button{width:70px;height:55px;border:0;border-radius:14px;background:#172c48;color:white;font-size:25px;font-weight:bold}
@media(min-width:800px){.controls{display:none}}
</style>
</head>
<body>

<div class="top">
<button onclick="location.href='/'">← SliqGames</button>
<div class="title">🏎️ Neon Racing</div>
</div>

<div id="game">

<div class="hud">
🏁 Punkte: <span id="score">0</span><br>
⚡ Geschwindigkeit: <span id="speed">5</span>
</div>

<div class="road" id="road">

<div class="line" style="top:-80px"></div>
<div class="line" style="top:100px"></div>
<div class="line" style="top:280px"></div>
<div class="line" style="top:460px"></div>
<div class="line" style="top:640px"></div>

<div class="car" id="car"></div>

</div>

<div class="controls">
<button onclick="moveLeft()">←</button>
<button onclick="moveRight()">→</button>
</div>

<div class="gameover" id="gameover">
<div class="gameoverBox">
<h1>💥 Unfall!</h1>
<p>Deine Punktzahl:</p>
<h2 id="finalScore">0</h2>
<button onclick="restart()">Nochmal fahren</button>
<button onclick="location.href='/'">Zurück zu SliqGames</button>
</div>
</div>

</div>

<script>
const road=document.getElementById("road");
const car=document.getElementById("car");
const scoreElement=document.getElementById("score");
const speedElement=document.getElementById("speed");
const gameover=document.getElementById("gameover");
const finalScore=document.getElementById("finalScore");

let carX=50;
let score=0;
let speed=5;
let running=true;
let enemies=[];

function moveLeft(){
if(!running)return;
carX-=7;
if(carX<8)carX=8;
car.style.left=carX+"%";
}

function moveRight(){
if(!running)return;
carX+=7;
if(carX>92)carX=92;
car.style.left=carX+"%";
}

document.addEventListener("keydown",function(e){
if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")moveLeft();
if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")moveRight();
});

function createEnemy(){
if(!running)return;

const enemy=document.createElement("div");
enemy.className="enemy";
enemy.style.left=(10+Math.random()*80)+"%";
enemy.style.top="-120px";

road.appendChild(enemy);

enemies.push({
element:enemy,
x:parseFloat(enemy.style.left),
y:-120
});
}

function collision(a,b){
const ar=a.getBoundingClientRect();
const br=b.getBoundingClientRect();

return !(
ar.right<br.left||
ar.left>br.right||
ar.bottom<br.top||
ar.top>br.bottom
);
}

function endGame(){
running=false;
finalScore.textContent=score;
gameover.style.display="flex";

const old=parseInt(localStorage.getItem("racingHighScore")||"0");
if(score>old){
localStorage.setItem("racingHighScore",score);
}
}

function gameLoop(){
if(!running)return;

for(let i=enemies.length-1;i>=0;i--){

const enemy=enemies[i];

enemy.y+=speed;
enemy.element.style.top=enemy.y+"px";

if(collision(car,enemy.element)){
endGame();
return;
}

if(enemy.y>window.innerHeight){

enemy.element.remove();
enemies.splice(i,1);

score++;
scoreElement.textContent=score;

if(score%10===0){
speed+=0.5;
speedElement.textContent=Math.floor(speed);
}
}
}

requestAnimationFrame(gameLoop);
}

function restart(){

document.querySelectorAll(".enemy").forEach(e=>e.remove());

enemies=[];
carX=50;
score=0;
speed=5;
running=true;

car.style.left="50%";
scoreElement.textContent="0";
speedElement.textContent="5";
gameover.style.display="none";

gameLoop();
}

setInterval(createEnemy,1000);
gameLoop();
</script>

</body>
</html>
