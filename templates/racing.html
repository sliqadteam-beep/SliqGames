<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Racing - SliqGames</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#050b14;
color:white;
font-family:Arial,sans-serif;
overflow:hidden;
}

.top{
height:65px;
background:#0b1829;
border-bottom:1px solid #20344d;
display:flex;
align-items:center;
padding:0 20px;
}

.top button{
background:#2563eb;
color:white;
border:0;
border-radius:10px;
padding:10px 16px;
font-weight:bold;
cursor:pointer;
}

.title{
flex:1;
text-align:center;
font-size:22px;
font-weight:900;
}

#game{
position:relative;
width:100vw;
height:calc(100vh - 65px);
overflow:hidden;
background:
linear-gradient(#142238,#07111f);
}

.road{
position:absolute;
left:50%;
transform:translateX(-50%);
width:min(540px,90vw);
height:100%;
background:
repeating-linear-gradient(
90deg,
#242424 0px,
#242424 80px,
#292929 80px,
#292929 160px
);
border-left:8px solid #eee;
border-right:8px solid #eee;
overflow:hidden;
box-shadow:0 0 50px rgba(0,0,0,.7);
}

.line{
position:absolute;
width:10px;
height:90px;
background:#fff;
left:50%;
transform:translateX(-50%);
box-shadow:0 0 10px white;
}

.car{
position:absolute;
width:58px;
height:100px;
background:linear-gradient(#60a5fa,#2563eb);
border-radius:14px;
bottom:45px;
left:50%;
transform:translateX(-50%);
box-shadow:0 0 25px #2563eb;
z-index:5;
}

.car:before{
content:"";
position:absolute;
width:38px;
height:38px;
background:#bfe2ff;
border-radius:9px;
left:10px;
top:10px;
}

.car:after{
content:"";
position:absolute;
width:8px;
height:20px;
background:#111;
left:7px;
bottom:10px;
box-shadow:36px 0 #111;
}

.enemy{
position:absolute;
width:58px;
height:100px;
background:linear-gradient(#ff7777,#ef2222);
border-radius:14px;
box-shadow:0 0 20px #ef4444;
z-index:4;
}

.enemy:before{
content:"";
position:absolute;
width:38px;
height:38px;
background:#ffc0c0;
border-radius:9px;
left:10px;
top:10px;
}

.hud{
position:absolute;
top:15px;
left:15px;
z-index:20;
background:rgba(5,11,20,.9);
border:1px solid #304966;
border-radius:14px;
padding:13px 17px;
font-weight:bold;
line-height:1.7;
}

.controls{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:15px;
z-index:30;
}

.controls button{
width:75px;
height:60px;
border:0;
border-radius:15px;
background:#172c48;
color:white;
font-size:27px;
font-weight:bold;
}

.gameover{
position:absolute;
inset:0;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.78);
z-index:50;
}

.gameoverBox{
background:#0d192b;
border:1px solid #304966;
border-radius:22px;
padding:30px;
text-align:center;
width:min(400px,90%);
}

.gameoverBox button{
width:100%;
padding:13px;
border:0;
border-radius:10px;
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

@media(min-width:800px){
.controls{display:none}
}
</style>
</head>

<body>

<div class="top">
<button onclick="location.href='/'">← SliqGames</button>
<div class="title">🏎️ Neon Racing</div>
</div>

<div id="game">

<div class="hud">
🏁 Punkte: <span id="score">0</span><br>
⚡ Geschwindigkeit: <span id="speed">5</span><br>
🏆 Rekord: <span id="highscore">0</span>
</div>

<div class="road" id="road">

<div class="line" style="top:-80px"></div>
<div class="line" style="top:100px"></div>
<div class="line" style="top:280px"></div>
<div class="line" style="top:460px"></div>
<div class="line" style="top:640px"></div>

<div class="car" id="car"></div>

</div>

<div class="controls">
<button onclick="moveLeft()">←</button>
<button onclick="moveRight()">→</button>
</div>

<div class="gameover" id="gameover">

<div class="gameoverBox">

<h1>💥 Unfall!</h1>

<p>Deine Punktzahl:</p>
<h2 id="finalScore">0</h2>

<button onclick="restart()">🔄 Nochmal fahren</button>
<button onclick="location.href='/'">← Zurück zu SliqGames</button>

</div>

</div>

</div>

<script>

const road=document.getElementById("road");
const car=document.getElementById("car");

const scoreElement=document.getElementById("score");
const speedElement=document.getElementById("speed");
const highscoreElement=document.getElementById("highscore");

const gameover=document.getElementById("gameover");
const finalScore=document.getElementById("finalScore");

let carX=50;
let score=0;
let speed=5;
let running=true;
let enemies=[];

let highscore=
parseInt(localStorage.getItem("racingHighScore")||"0");

highscoreElement.textContent=highscore;

function moveLeft(){

if(!running)return;

carX-=6;

if(carX<10)carX=10;

car.style.left=carX+"%";

}

function moveRight(){

if(!running)return;

carX+=6;

if(carX>90)carX=90;

car.style.left=carX+"%";

}

document.addEventListener("keydown",e=>{

if(
e.key==="ArrowLeft"||
e.key.toLowerCase()==="a"
){
moveLeft();
}

if(
e.key==="ArrowRight"||
e.key.toLowerCase()==="d"
){
moveRight();
}

});

function createEnemy(){

if(!running)return;

const enemy=document.createElement("div");

enemy.className="enemy";

enemy.style.left=
(10+Math.random()*80)+"%";

enemy.style.top="-120px";

road.appendChild(enemy);

enemies.push({
element:enemy,
y:-120
});

}

function collision(a,b){

const ar=a.getBoundingClientRect();
const br=b.getBoundingClientRect();

return !(
ar.right<br.left||
ar.left>br.right||
ar.bottom<br.top||
ar.top>br.bottom
);

}

function endGame(){

running=false;

finalScore.textContent=score;

gameover.style.display="flex";

if(score>highscore){

highscore=score;

localStorage.setItem(
"racingHighScore",
highscore
);

highscoreElement.textContent=highscore;

}

}

function gameLoop(){

if(!running)return;

for(
let i=enemies.length-1;
i>=0;
i--
){

const enemy=enemies[i];

enemy.y+=speed;

enemy.element.style.top=
enemy.y+"px";

if(collision(car,enemy.element)){

endGame();

return;

}

if(enemy.y>window.innerHeight){

enemy.element.remove();

enemies.splice(i,1);

score++;

scoreElement.textContent=score;

if(score%8===0){

speed+=.6;

speedElement.textContent=
Math.floor(speed);

}

}

}

requestAnimationFrame(gameLoop);

}

function restart(){

document
.querySelectorAll(".enemy")
.forEach(e=>e.remove());

enemies=[];

carX=50;
score=0;
speed=5;
running=true;

car.style.left="50%";

scoreElement.textContent="0";
speedElement.textContent="5";

gameover.style.display="none";

gameLoop();

}

setInterval(createEnemy,850);

gameLoop();

</script>

</body>
</html>
