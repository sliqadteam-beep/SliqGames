<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archer Hero - SliqGames</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#07111f;
color:white;
font-family:Arial,Segoe UI,sans-serif;
overflow:hidden;
}

.top{
height:65px;
background:#0b1829;
border-bottom:1px solid #243952;
display:flex;
align-items:center;
padding:0 18px;
gap:15px;
}

.back{
background:#2563eb;
border:0;
color:white;
padding:10px 16px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.title{
font-size:20px;
font-weight:900;
}

.score{
margin-left:auto;
font-size:18px;
font-weight:bold;
}

#game{
position:relative;
height:calc(100vh - 65px);
overflow:hidden;
background:
linear-gradient(#6ec6ff 0%,#bdeeff 65%,#6fba4b 65%,#4d9138 100%);
}

#player{
position:absolute;
left:90px;
bottom:70px;
font-size:70px;
user-select:none;
transition:transform .1s;
}

.enemy{
position:absolute;
bottom:70px;
font-size:60px;
user-select:none;
}

.arrow{
position:absolute;
font-size:32px;
z-index:5;
}

#startScreen{
position:absolute;
inset:0;
background:rgba(7,17,31,.78);
display:flex;
align-items:center;
justify-content:center;
z-index:20;
}

.panel{
background:#0d1b2d;
border:1px solid #2a4564;
border-radius:22px;
padding:35px;
width:min(450px,90%);
text-align:center;
box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.panel h1{
font-size:40px;
margin:0 0 10px;
}

.panel p{
color:#9fb0c7;
}

.start{
background:#2563eb;
border:0;
color:white;
padding:14px 28px;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.controls{
position:absolute;
bottom:15px;
left:50%;
transform:translateX(-50%);
background:rgba(7,17,31,.65);
padding:10px 18px;
border-radius:12px;
font-size:13px;
color:#dbeafe;
}

#gameOver{
position:absolute;
inset:0;
background:rgba(0,0,0,.72);
display:none;
align-items:center;
justify-content:center;
z-index:15;
}

@media(max-width:600px){

#player{
left:40px;
}

.panel h1{
font-size:30px;
}

}
</style>
</head>

<body>

<div class="top">

<button class="back" onclick="location.href='/'">
← SliqGames
</button>

<div class="title">
🏹 Archer Hero
</div>

<div class="score">
Punkte: <span id="score">0</span>
</div>

</div>

<div id="game">

<div id="player">🏹</div>

<div id="startScreen">

<div class="panel">

<h1>🏹 Archer Hero</h1>

<p>
Besiege deine Gegner und sammle so viele Punkte wie möglich!
</p>

<button class="start" onclick="startGame()">
Spiel starten
</button>

</div>

</div>

<div id="gameOver">

<div class="panel">

<h1>💀 Game Over</h1>

<p>
Deine Punkte: <strong id="finalScore">0</strong>
</p>

<button class="start" onclick="startGame()">
Nochmal spielen
</button>

<button class="back" style="margin-top:10px;width:100%" onclick="location.href='/'">
Zurück zu SliqGames
</button>

</div>

</div>

<div class="controls">
Klicke oder drücke LEERTASTE, um zu schießen
</div>

</div>

<script>

let running=false;
let score=0;
let enemies=[];
let arrows=[];
let enemyTimer=null;
let animation=null;

const player=document.getElementById("player");
const game=document.getElementById("game");

function startGame(){

score=0;
document.getElementById("score").textContent=score;

document.getElementById("startScreen").style.display="none";
document.getElementById("gameOver").style.display="none";

enemies.forEach(e=>e.el.remove());
arrows.forEach(a=>a.el.remove());

enemies=[];
arrows=[];

running=true;

if(enemyTimer){
clearInterval(enemyTimer);
}

enemyTimer=setInterval(createEnemy,1200);

animation=requestAnimationFrame(loop);

}

function createEnemy(){

if(!running)return;

const enemy=document.createElement("div");

enemy.className="enemy";
enemy.textContent="👾";

const startX=game.clientWidth+50;

enemy.style.left=startX+"px";

game.appendChild(enemy);

enemies.push({
el:enemy,
x:startX,
speed:3+Math.random()*2
});

}

function shoot(){

if(!running)return;

const arrow=document.createElement("div");

arrow.className="arrow";
arrow.textContent="➡️";

const playerRect=player.getBoundingClientRect();
const gameRect=game.getBoundingClientRect();

let x=playerRect.right-gameRect.left;
let y=playerRect.top-gameRect.top+20;

arrow.style.left=x+"px";
arrow.style.top=y+"px";

game.appendChild(arrow);

arrows.push({
el:arrow,
x:x,
y:y,
speed:10
});

}

function loop(){

if(!running)return;

for(let i=enemies.length-1;i>=0;i--){

const e=enemies[i];

e.x-=e.speed;
e.el.style.left=e.x+"px";

if(e.x<40){

gameOver();
return;

}

}

for(let i=arrows.length-1;i>=0;i--){

const a=arrows[i];

a.x+=a.speed;
a.el.style.left=a.x+"px";

if(a.x>game.clientWidth){

a.el.remove();
arrows.splice(i,1);
continue;

}

for(let j=enemies.length-1;j>=0;j--){

const e=enemies[j];

if(
Math.abs(a.x-e.x)<55 &&
Math.abs(a.y-(game.clientHeight-120))<80
){

e.el.remove();
a.el.remove();

enemies.splice(j,1);
arrows.splice(i,1);

score++;
document.getElementById("score").textContent=score;

break;

}

}

}

animation=requestAnimationFrame(loop);

}

function gameOver(){

running=false;

if(enemyTimer){
clearInterval(enemyTimer);
enemyTimer=null;
}

if(animation){
cancelAnimationFrame(animation);
animation=null;
}

document.getElementById("finalScore").textContent=score;

document.getElementById("gameOver").style.display="flex";

}

document.addEventListener("keydown",function(e){

if(e.code==="Space"){

e.preventDefault();

shoot();

}

});

game.addEventListener("click",function(e){

if(
e.target.closest(".panel") ||
e.target.closest(".back")
)return;

shoot();

});

</script>

</body>
</html>
