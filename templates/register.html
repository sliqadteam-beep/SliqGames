<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registrieren - SliqGames</title>
<style>
body{margin:0;background:#07111f;color:white;font-family:Arial;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{width:380px;max-width:92%;background:#0d1c30;padding:30px;border-radius:20px;border:1px solid #1b3049}
input{width:100%;padding:13px;margin:7px 0;background:#07111f;border:1px solid #243b55;border-radius:10px;color:white}
button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}
a{color:#60a5fa}.back{display:block;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="box">
<h1>📝 Registrieren</h1>
<input type="text" placeholder="Benutzername">
<input type="email" placeholder="E-Mail">
<input type="password" placeholder="Passwort">
<input type="password" placeholder="Passwort wiederholen">
<button>Konto erstellen</button>
<p>Du hast bereits ein Konto?</p>
<a href="/login">Anmelden</a>
<a class="back" href="/">← Zurück zu SliqGames</a>
</div>
</body>
</html>
